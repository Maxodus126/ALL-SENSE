name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-setup:
    runs-on: windows-latest
    permissions:
      contents: write   # diperlukan softprops/action-gh-release untuk bikin rilis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 1. Publish app (single-file self-contained) x64.
      - name: Publish app
        run: dotnet publish AllSense.App/AllSense.App.csproj -c Release -r win-x64 --self-contained true -o out/app

      # 2. Sign app SEBELUM dikompres (payload berisi exe yang sudah ditandatangani).
      - name: Sign app
        shell: pwsh
        run: .\.github\scripts\sign.ps1 -Files "out/app/AllSense.App.exe"

      # 3. Kompres payload → AllSense.App.pkg.gz (dibaca Setup saat build).
      - name: Compress payload
        shell: pwsh
        run: .\AllSense.Setup\compress-payload.ps1 -Source "$env:GITHUB_WORKSPACE\out\app\AllSense.App.exe"

      # 4. Publish uninstaller ke jalur yang di-embed Setup (selalu segar).
      - name: Publish uninstaller
        run: dotnet publish AllSense.Uninstall/AllSense.Uninstall.csproj -c Release -r win-x64 --self-contained true -o AllSense.Uninstall/out

      - name: Sign uninstaller
        shell: pwsh
        run: .\.github\scripts\sign.ps1 -Files "AllSense.Uninstall/out/AllSense.Uninstall.exe"

      # 5. Publish setup (embed payload terkompres + uninstaller).
      - name: Publish setup
        run: dotnet publish AllSense.Setup/AllSense.Setup.csproj -c Release -r win-x64 --self-contained true -o out/setup

      - name: Sign setup
        shell: pwsh
        run: .\.github\scripts\sign.ps1 -Files "out/setup/AllSense.Setup.exe"

      # Rename jadi nama yang dipakai website (AllSense-Setup.exe / AllSense-x64.exe).
      - name: Rename binaries untuk rilis
        shell: pwsh
        run: |
          Copy-Item out/setup/AllSense.Setup.exe out/AllSense-Setup.exe
          Copy-Item out/app/AllSense.App.exe out/AllSense-x64.exe

      # 6. Paket zip portabel.
      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out\zip | Out-Null
          Copy-Item out\app\AllSense.App.exe out\zip\AllSense.App.exe
          Compress-Archive -Path out\zip\AllSense.App.exe -DestinationPath out\AllSense-x64.zip -CompressionLevel Optimal

      # 7. Unit test logika setup.
      - name: Test
        run: dotnet test AllSense.Setup.Tests/AllSense.Setup.Tests.csproj -c Release

      # 8. Selftest app (informasional; bisa gagal di VM tanpa sensor → tidak blokir).
      - name: Selftest (informational)
        continue-on-error: true
        run: out\app\AllSense.App.exe --selftest

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            out/AllSense-Setup.exe
            out/AllSense-x64.exe
            out/AllSense-x64.zip

      # 9. Rilis otomatis ketika tag v* di-push.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/AllSense-Setup.exe
            out/AllSense-x64.zip
            out/AllSense-x64.exe
