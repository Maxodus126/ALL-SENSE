<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AllSense Control — Demo Interaktif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Russo+One&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============ AllSense Control — "Precision Instrument Console" ============
     Konsep: dashboard instrumen presisi (flight-instrument / lab bench).
     Stage biru-tua pekat, tekstur grid halus, sudut kartu terpotong (PCB),
     data monospace, gauge ber-tick ring, aksen amber (daya),
     merah (termal), cyan (GPU), hijau (sehat). */

  :root{
    --bg:#070b12;
    --surface:#0c121c;
    --panel:#111925;
    --panel2:#172230;
    --panel3:#1e2c3d;
    --edge:#23324a;
    --line:rgba(148,177,211,.10);
    --line2:rgba(148,177,211,.20);
    --txt:#eaf0f8;
    --tx:#aebdd3;
    --tx2:#6f7f9a;
    --amber:#ff2d4d;
    --amber2:#d40f2e;
    --red:#ff5f5f;
    --cyan:#45c8f0;
    --green:#3bd29a;
    --blu:#5f9efc;
    --sans:"Chakra Petch","Segoe UI",system-ui,sans-serif;
    --display:"Russo One","Chakra Petch",sans-serif;
    --mono:"JetBrains Mono","Cascadia Mono",Consolas,monospace;
    color-scheme:dark;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--sans);color:var(--txt);overflow:hidden;
    background:
      radial-gradient(1100px 640px at 82% -12%, rgba(255,45,77,.07), transparent 58%),
      radial-gradient(900px 560px at -8% 112%, rgba(69,200,240,.06), transparent 55%),
      radial-gradient(1400px 900px at 50% 118%, rgba(95,158,252,.05), transparent 60%),
      var(--bg);
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(120% 90% at 50% 0%, #000 30%, transparent 85%);
    mask-image:radial-gradient(120% 90% at 50% 0%, #000 30%, transparent 85%);
  }
  button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:0}
  svg{display:block}
  ::selection{background:rgba(255,45,77,.28)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--edge);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--panel3);background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}

  .shell{position:relative;z-index:1;display:flex;height:100%}

  /* ---------- Rail ---------- */
  .rail{
    width:236px;min-width:236px;display:flex;flex-direction:column;
    background:linear-gradient(180deg, rgba(255,255,255,.02), transparent 30%), var(--surface);
    border-right:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:12px;padding:22px 18px 18px;border-bottom:1px solid var(--line)}
  .mark{
    width:34px;height:34px;border-radius:9px;flex-shrink:0;
    background:linear-gradient(140deg, var(--amber) 0%, var(--amber2) 45%, #9c0a24 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.20);
    display:grid;place-items:center;position:relative;
  }
  .mark::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1px dashed rgba(40,0,12,.5)}
  .mark svg{width:19px;height:19px;position:relative;z-index:1}
  .brand .nm{font-family:var(--display);font-size:17px;letter-spacing:1.6px;line-height:1}
  .brand .nm b{color:var(--amber);font-weight:700}
  .brand .tag{margin-top:3px;font-size:9.5px;letter-spacing:1.6px;color:var(--tx2);text-transform:uppercase}

  .nav{flex:1;overflow-y:auto;padding:10px 12px 14px}
  .g{padding:18px 12px 7px;font-size:9.5px;font-weight:600;color:var(--tx2);letter-spacing:2px;text-transform:uppercase}
  .nav-it{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:10px 12px;margin:2px 0;border-radius:8px;
    color:var(--tx);font-size:13.5px;font-weight:500;
    transition:background .14s,color .14s;position:relative;
    font-family:var(--sans);
  }
  .nav-it .ic{width:18px;height:18px;flex-shrink:0;color:var(--tx2);transition:color .14s}
  .nav-it:hover{background:var(--panel);color:var(--txt)}
  .nav-it:hover .ic{color:var(--amber)}
  .nav-it.active{background:linear-gradient(90deg, rgba(255,45,77,.12), rgba(255,45,77,.02));color:#fff}
  .nav-it.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--amber)}
  .nav-it.active .ic{color:var(--amber)}
  .nav-it .k{font-family:var(--mono);font-size:9px;color:var(--tx2);letter-spacing:1px}
  .nav-it.active .k{color:var(--amber)}
  .railfoot{margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;font-size:10px;color:var(--tx2);line-height:1.8;letter-spacing:.4px}
  .railfoot b{color:var(--txt);font-weight:600}
  .railfoot .mono{font-family:var(--mono);font-size:10px;color:var(--amber)}
  .railfoot .live{display:flex;align-items:center;gap:6px;margin-top:2px}
  .railfoot .live i{width:6px;height:6px;border-radius:50%;background:var(--green)}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 28px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,.02), transparent), var(--bg);
  }
  .top h1{font-family:var(--display);font-size:16px;font-weight:400;letter-spacing:1px;text-transform:uppercase}
  .top h1 span{color:var(--amber)}
  .top .crumb{font-size:11px;color:var(--tx2);letter-spacing:1px;border-left:1px solid var(--line2);padding-left:14px}
  .spacer{flex:1}
  .chip{
    display:inline-flex;align-items:center;gap:8px;
    font-size:11.5px;color:var(--tx);letter-spacing:.4px;
    background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 12px;
  }
  .chip i{width:6px;height:6px;border-radius:50%;background:var(--green)}
  .chip b{font-weight:600;color:var(--txt)}
  .chip .mono{font-family:var(--mono)}
  .chip .k{color:var(--tx2)}

  .content{flex:1;overflow-y:auto;padding:24px 28px 60px}
  .wrap{max-width:1280px;margin:0 auto}

  /* ---------- Generic card ---------- */
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.02), transparent 60%), var(--panel);
    border:1px solid var(--line);border-radius:12px;position:relative;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
    transition:border-color .18s, transform .18s, box-shadow .18s;
  }
  .card::before{content:"";position:absolute;top:-1px;left:-1px;right:-1px;height:1px;border-radius:12px 12px 0 0;background:linear-gradient(90deg, rgba(255,45,77,.55), transparent 60%)}
  .card:hover{border-color:var(--line2);box-shadow:0 8px 26px -18px rgba(0,0,0,.6)}
  .ipad{padding:20px}
  .c-t{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:1.8px;font-weight:600;display:flex;align-items:center;gap:8px}
  .c-t::before{content:"";width:6px;height:6px;background:var(--amber);transform:rotate(45deg)}
  .c-t.amber::before{background:var(--amber)}
  .c-t.cyan::before{background:var(--cyan)}
  .c-t.green::before{background:var(--green)}
  .c-t.red::before{background:var(--red)}
  .c-t.blue::before{background:var(--blu)}

  .grid{display:grid;gap:18px}
  .c4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .c3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  .c2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

  .section{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}
  .section h3{font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--txt);display:flex;align-items:center;gap:10px}
  .section h3::after{content:"";height:1px;width:42px;background:linear-gradient(90deg, var(--red), transparent)}
  .section .hint{font-size:11px;color:var(--tx2);letter-spacing:.5px}
  .section .hint b{color:var(--amber);font-weight:600;font-family:var(--mono)}

  /* ---------- Instrument / gauge tile ---------- */
  .tile{display:flex;flex-direction:column;amin-height:210px}
  .tile .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .tile .tag{font-family:var(--mono);font-size:9px;color:var(--tx2);letter-spacing:1px;border:1px solid var(--line);border-radius:5px;padding:2px 7px}
  .tile .body{display:flex;align-items:center;gap:16px}
  .gauge{position:relative;width:92px;height:92px;flex-shrink:0}
  .gauge svg.ticks{position:absolute;inset:0;width:100%;height:100%}
  .gauge .arc{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--gc,var(--amber)) calc(var(--p)*1%), rgba(255,255,255,.065) 0)}
  .gauge .arc::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--panel)}
  .gauge .core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
  .gauge .core .num{font-family:var(--mono);font-weight:600;font-size:21px;line-height:1}
  .gauge .core .unit{font-size:9.5px;color:var(--tx2);margin-top:1px}
  .tile .meta{margin-top:4px}
  .tile .meta .nm{font-size:13.5px;font-weight:600}
  .tile .meta .sb{font-size:11px;color:var(--tx2);margin-top:2px}
  .tile .sub{margin-top:auto;padding-top:14px;font-size:11px;color:var(--tx2)}
  .spark{margin-top:12px;height:36px;width:100%}

  /* ---------- Bars ---------- */
  .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:3px;background:var(--gc,var(--amber))}

  /* ---------- Power modes ---------- */
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .seg-btn{
    padding:16px 14px;border-radius:11px;text-align:left;position:relative;
    background:var(--panel2);border:1px solid var(--line);
    transition:all .16s;overflow:hidden;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
  }
  .seg-btn::before{content:"";position:absolute;inset:0;background:radial-gradient(140px 90px at 80% -10%, rgba(255,45,77,.14), transparent 70%);opacity:0;transition:opacity .2s}
  .seg-btn:hover{border-color:var(--line2)}
  .seg-btn:hover::before{opacity:1}
  .seg-btn .row{display:flex;align-items:center;gap:12px;position:relative}
  .seg-btn .ic{width:38px;height:38px;border-radius:9px;background:var(--panel3);display:grid;place-items:center;color:var(--tx);transition:all .16s}
  .seg-btn .ic svg{width:20px;height:20px}
  .seg-btn .n{font-size:14px;font-weight:600;display:block}
  .seg-btn .d{font-size:10.5px;color:var(--tx2);display:block;margin-top:1px}
  .seg-btn .b{position:absolute;top:13px;right:13px;font-size:8.5px;font-weight:700;letter-spacing:1.2px;font-family:var(--mono);color:var(--tx2);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
  .seg-btn.on{background:linear-gradient(150deg, rgba(255,45,77,.20), rgba(255,45,77,.04)), var(--panel2);border-color:rgba(255,45,77,.45)}
  .seg-btn.on .ic{background:var(--amber);color:#2a0008}
  .seg-btn.on .d{color:color-mix(in srgb, var(--amber) 70%, #fff)}
  .seg-btn.on .b{border-color:rgba(255,45,77,.5);color:var(--amber)}
  .seg-btn.on::after{content:"";position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--amber)}

  .link{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:12.5px;margin-top:12px;transition:border-color .15s}
  .link:hover{border-color:var(--line2)}
  .link input{width:16px;height:16px;accent-color:var(--amber)}
  .link .lbl{color:var(--tx)}
  .link .st{margin-left:auto;font-size:10.5px;color:var(--tx2)}
  .link .st b{font-size:11.5px;color:var(--amber);font-family:var(--mono)}

  /* ---------- KV rows ---------- */
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--tx);letter-spacing:.3px}
  .row .v{font-weight:600;text-align:right}
  .row .v.m{font-family:var(--mono);font-size:12px}
  .row .v.g{color:var(--green)} .row .v.r{color:var(--red)} .row .v.a{color:var(--amber)} .row .v.b{color:var(--blu)} .row .v.c{color:var(--cyan)}

  /* ---------- Usage meter ---------- */
  .usage{height:10px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden;border:1px solid var(--line)}
  .usage i{display:block;height:100%;background:linear-gradient(90deg, var(--amber2), var(--amber));width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .usage i.cyan{background:linear-gradient(90deg,#2a90b8,var(--cyan))}
  .usage i.green{background:linear-gradient(90deg,#23a877,var(--green))}
  .usage i.red{background:linear-gradient(90deg,#c63a3a,var(--red))}

  .btn{background:linear-gradient(140deg, var(--amber), var(--amber2));color:#2a0008;font-weight:600;font-size:12.5px;padding:10px 18px;border-radius:9px;transition:filter .15s}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--panel2);color:var(--tx);border:1px solid var(--line);box-shadow:none}
  .btn.ghost:hover{border-color:var(--line2);color:#fff}

  .qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .qa-btn{padding:12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font-size:12px;display:flex;align-items:center;justify-content:center;gap:9px;transition:all .13s}
  .qa-btn .ic{width:16px;height:16px;color:var(--tx2)}
  .qa-btn:hover{border-color:rgba(255,45,77,.4);color:#fff;background:linear-gradient(150deg, rgba(255,45,77,.12), transparent)}
  .qa-btn:hover .ic{color:var(--amber)}

  .empty{border:1px dashed var(--line2);border-radius:9px;padding:24px;text-align:center;color:var(--tx2);font-size:12px}
  .empty b{display:block;color:var(--txt);font-size:13.5px;margin-bottom:4px}

  .library{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .library .art{display:flex;align-items:center;gap:14px}
  .th{width:56px;height:56px;border-radius:11px;background:var(--panel3);border:1px solid var(--line);display:grid;place-items:center;color:var(--amber)}
  .th svg{width:28px;height:28px}

  .foot{text-align:center;color:var(--tx2);font-size:11px;margin-top:30px;letter-spacing:.5px}

  /* ---------- Art blocks ---------- */
  .hero{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  .hero .txt{flex:1;min-width:220px}
  .hero .art{flex-shrink:0}
  .hero h2{font-family:var(--display);font-size:20px;font-weight:400;letter-spacing:.4px;margin-top:6px}
  .hero .sub{font-size:12.5px;color:var(--tx);margin-top:4px;line-height:1.6}
  .hero .pill{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;font-weight:600;color:var(--amber);border:1px solid rgba(255,45,77,.4);border-radius:7px;padding:6px 13px;letter-spacing:.6px;background:rgba(255,45,77,.06)}
  .hero .pill i{width:7px;height:7px;border-radius:50%;background:var(--amber)}

  /* ---------- Animations ---------- */
  .wrap{animation:fadeIn .3s cubic-bezier(.2,.7,.2,1)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .scan{opacity:.25}
  @keyframes scan{0%{transform:translateY(-40px);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(140px);opacity:0}}

  @media (prefers-reduced-motion:reduce){
    .wrap,.scan,.railfoot .live i{animation:none !important}
    .card,.seg-btn,.btn,.qa-btn{transition:none !important}
  }

  @media(max-width:800px){
    .rail{width:100%;min-width:0;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}
    .brand{border-bottom:0;padding:12px 16px}
    .brand .tag{display:none}
    .nav{display:flex;flex-wrap:wrap;gap:2px;padding:6px 12px 12px;overflow:visible}
    .g{display:none}
    .nav-it{flex:1;min-width:90px;justify-content:center;padding:9px 6px;font-size:12px}
    .nav-it .ic{width:16px;height:16px}
    .nav-it.active::before{display:none}
    .railfoot{display:none}
    .shell{flex-direction:column}
    .top{padding:12px 16px}
    .content{padding:16px 14px 50px}
    .seg{grid-template-columns:1fr}
    .c4,.c3,.c2{grid-template-columns:1fr}
    .top .crumb{display:none}
  }
</style>
</head>
<body>
<div class="shell">

  <!-- ==================== RAIL ==================== -->
  <aside class="rail">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#2a0008" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M4.5 12h3l1.5-4 2 8 1.5-6 1 2h4.5"/></svg></div>
      <div>
        <div class="nm">ALL<b>SENSE</b></div>
        <div class="tag">Control · Console</div>
      </div>
    </div>
    <nav class="nav">
      <div class="g">Utama</div>
      <button class="nav-it active" data-p="dashboard"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span>Dashboard</button>
      <button class="nav-it" data-p="power"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9M6.5 6.5a8 8 0 1 0 11 0"/></svg></span>Power Center</button>
      <button class="nav-it" data-p="cooling"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17.5 5.5l-5.5 5-5.5-5M17.5 18.5l-5.5-5-5.5 5M2.5 8.5l19 7M2.5 15.5l19-7"/></svg></span>Cooling</button>
      <button class="nav-it" data-p="battery"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 10v4M6 10v4M9.5 10v4M13 10v4"/></svg></span>Battery</button>
      <div class="g">Sistem</div>
      <button class="nav-it" data-p="mylaptop"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="M2 20h20M12 16v4"/></svg></span>My Laptop</button>
      <button class="nav-it" data-p="storage"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M5 12h14M9 8h.01M9 16h.01"/></svg></span>Storage</button>
      <button class="nav-it" data-p="gaming"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10c-2.8 0-5 1.4-5 4s2.2 4 5 4c1.4 0 2.4-.5 3.8-1.8.8-.8 1-1.2 1.2-1.2s.4.4 1.2 1.2C14.6 17.5 15.6 18 17 18c2.8 0 5-1.4 5-4s-2.2-4-5-4z"/><path d="M7.5 13v3M6 14.5h3"/></svg></span>Gaming Hub</button>
      <div class="g">Lainnya</div>
      <button class="nav-it" data-p="settings"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg></span>Settings</button>

var _shown={};
function setVal(id,v){
  var el=document.getElementById(id);if(!el)return;

function setLinked(m){acMode=m;dcMode=m;render()}
function toggleLink(){linked=!linked;if(linked){acMode='bal';dcMode='bal'}render()}

var current='dashboard';
function go(p){current=p;render()}
function render(){
  var wrap=document.getElementById('content');
  document.getElementById('pgtitle').innerHTML=PAGES[current].t;
  document.getElementById('crumb').textContent=PAGES[current].crumb;
  wrap.innerHTML='<div class="wrap">'+PAGES[current].html()+'</div>';
  var b=document.querySelectorAll('.nav-it');
  for(var i=0;i<b.length;i++)b[i].classList.toggle('active',b[i].getAttribute('data-p')===current);
  drawAll();
}

var navBtns=document.querySelectorAll('.nav-it');
for(var n=0;n<navBtns.length;n++){(function(b){b.addEventListener('click',function(){go(b.getAttribute('data-p'))})})(navBtns[n]);}

setInterval(function(){
  try{
    sv('clock',new Date().toLocaleTimeString('id-ID',{hour12:false}));
    S.cpu=clamp(S.cpu+rnd(-4,4),5,98);
    S.gpu=clamp(S.gpu+rnd(-5,5),5,98);
    S.ram=clamp(S.ram+rnd(-2,2),20,95);
    S.cpuc=clamp(S.cpuc+rnd(-3,3),40,96);
    S.gpuc=clamp(S.gpuc+rnd(-2,2),40,90);
    S.bat=clamp(S.bat+rnd(-1,1.4),5,100);
    if(current==='dashboard'||current==='cooling'||current==='battery'){
      drawAll();
      sv('t-cpu',Math.round(S.cpuc)+'°C · ACPI');sv('t-gpu',Math.round(S.gpuc)+'°C · therm');
      sv('t-ram',(Math.round(S.ram*0.16*10)/10)+' GB terpakai');
      sv('batnum',Math.round(S.bat));
      sv('tr-cpu',Math.round(S.cpuc)+'°C');sv('tb-cpu',null)||document.getElementById('tb-cpu')&&(document.getElementById('tb-cpu').style.width=pctTemp(S.cpuc)+'%');
      sv('tr-gpu',Math.round(S.gpuc)+'°C');document.getElementById('tb-gpu')&&(document.getElementById('tb-gpu').style.width=pctTemp(S.gpuc)+'%');
      sv('tr-ram',Math.round(S.ram)+'%');document.getElementById('tb-ram')&&(document.getElementById('tb-ram').style.width=S.ram+'%');
      document.getElementById('ramload')&&(document.getElementById('ramload').textContent=Math.round(S.ram)+'%');
    }
  }catch(e){}
},2000);

try{render();}catch(e){}
</script>
